name: Build LATCHI STREAM

on:
  workflow_dispatch:
    inputs:
      bundle_ffmpeg:
        description: 'إرفاق ffmpeg.exe داخل الحزمة'
        type: choice
        options: ['1', '0']
        default: '1'
      publish_release:
        description: 'إنشاء Release على GitHub'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: |
          node --check main.js
          node --check preload.js
          node --check ui/app.js
          node --check core/OAuth.js
          node --check core/YouTubeApi.js
          node --check core/VideoStream.js

      - name: Unit tests
        run: node tests/core.test.js

      - name: Download ffmpeg (ffmpeg + ffprobe)
        if: ${{ github.event_name == 'push' || inputs.bundle_ffmpeg == '1' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources/ffmpeg | Out-Null
          $url = 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
          Invoke-WebRequest -Uri $url -OutFile ff.zip -UseBasicParsing
          Expand-Archive -Path ff.zip -DestinationPath ffx -Force
          $ff = Get-ChildItem ffx -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $fp = Get-ChildItem ffx -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (-not $ff) { throw 'ffmpeg.exe not found' }
          if (-not $fp) { throw 'ffprobe.exe not found' }
          Copy-Item $ff.FullName resources/ffmpeg/ffmpeg.exe -Force
          Copy-Item $fp.FullName resources/ffmpeg/ffprobe.exe -Force
          Remove-Item ff.zip, ffx -Recurse -Force -ErrorAction SilentlyContinue
          foreach ($n in @('ffmpeg.exe','ffprobe.exe')) {
            $s = (Get-Item "resources/ffmpeg/$n").Length
            Write-Host "$n = $s bytes"
            if ($s -lt 1000000) { throw "$n غير مكتمل" }
          }

      - name: Build NSIS installer (x64)
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Build portable (x64)
        run: npx electron-builder --win portable --x64 --publish never

      - name: Verify packaged app (ffmpeg + no secrets)
        shell: pwsh
        run: |
          $un = 'dist/win-unpacked'
          if (-not (Test-Path $un)) { throw 'win-unpacked غير موجود' }
          if (Test-Path "$un/resources/ffmpeg/ffmpeg.exe") {
            Write-Host "ffmpeg داخل الحزمة = $((Get-Item "$un/resources/ffmpeg/ffmpeg.exe").Length) bytes"
          }
          if (Test-Path "$un/resources/ffmpeg/ffprobe.exe") {
            Write-Host "ffprobe داخل الحزمة = $((Get-Item "$un/resources/ffmpeg/ffprobe.exe").Length) bytes"
          }
          # لا أسرار داخل الحزمة
          $bad = Get-ChildItem $un -Recurse -Include oauth.json,oauth-client.json,settings.json -ErrorAction SilentlyContinue
          if ($bad) { throw "ملفات أسرار داخل الحزمة: $($bad.FullName)" }
          Write-Host 'لا أسرار في الحزمة ✓'

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem dist -File | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LATCHI-STREAM-v4.2.0-windows
          path: dist/*.exe

      - name: Publish release
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || 'latchi-stream-v4.2.0' }}
          name: 'LATCHI STREAM v4.2.0'
          body: |
            # LATCHI STREAM v4.2.0

            **تحوّل كامل**: من التقاط الشاشة إلى **بث فيديوهات محلية على YouTube** عبر Google OAuth.

            ## الملفات
            - `LATCHI-STREAM-4.2.0-Setup.exe` — مثبّت
            - `LATCHI-STREAM-4.2.0-Portable.exe` — محمول

            ## ما الجديد
            - تسجيل دخول Google (OAuth + PKCE) في متصفح النظام
            - اختيار قناتك من YouTube (يدعم القنوات المتعددة وBrand Accounts)
            - SELECT VIDEO: تختار ملفاً محلياً وتنشره على قناتك مباشرة
            - نسخ مباشر بلا ترميز عند توافق الملف · ترميز خفيف عند الحاجة
            - إيقاف تلقائي عند نهاية الفيديو + إنهاء البث عبر API (لا بث عالق)
            - لا التقاط شاشة · لا معاينة · **لا ميكروفون**
          files: |
            dist/*.exe
          generate_release_notes: true
